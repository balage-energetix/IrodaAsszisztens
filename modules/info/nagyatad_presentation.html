<!DOCTYPE html>
<html lang="hu" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nagyatád bemutató - Irodai Asszisztens</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Outfit:wght@400;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../css/main.css">
    <style>
        :root {
            --primary-atad: #2e7d32;
            --accent-atad: #fb8c00;
            --bg-glass: rgba(255, 255, 255, 0.9);
        }

        body {
            overflow-x: hidden;
            background-color: #f8f9fa;
        }

        /* Hero Styling - Clean & Minimal */
        .hero-section {
            height: 40vh;
            background: linear-gradient(135deg, var(--primary-atad) 0%, #1b5e20 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
            position: relative;
            box-shadow: inset 0 -20px 40px rgba(0, 0, 0, 0.1);
        }

        .hero-title {
            font-size: clamp(2rem, 8vw, 4.5rem);
            font-weight: 800;
            letter-spacing: -2px;
            animation: slideDown 1s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .hero-title small {
            display: block;
            font-size: 0.35em;
            letter-spacing: 8px;
            margin-top: 10px;
            opacity: 0.9;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Content Container */
        .content-container {
            max-width: 1200px;
            margin: -60px auto 4rem;
            position: relative;
            z-index: 10;
            padding: 0 1.5rem;
        }

        /* Section Cards */
        .section-card {
            background: var(--bg-card);
            border-radius: 24px;
            padding: 3rem;
            margin-bottom: 2.5rem;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.06);
            border: 1px solid var(--border-color);
            color: var(--text-main);
        }

        .section-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .section-header h2 {
            font-size: 2.2rem;
            color: var(--primary-atad);
            margin-bottom: 0.5rem;
        }

        [data-theme="dark"] .section-header h2 {
            color: var(--accent-atad);
            text-shadow: 0 0 10px rgba(251, 140, 0, 0.3);
        }

        .section-header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        /* Video Player Section */
        #atad-video {
            width: 100%;
            border-radius: 16px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.2);
            background: black;
            aspect-ratio: 16 / 9;
        }

        /* Audio Bar - From Gas Evaluator */
        .audio-bar {
            position: sticky;
            top: 70px;
            /* Adjust based on global header height */
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            height: 45px;
            display: flex;
            align-items: center;
            padding: 0 2rem;
            gap: 1.5rem;
            z-index: 1000;
            border-bottom: 1px solid var(--primary-atad);
            color: white;
            font-size: 0.85rem;
            margin-bottom: 0;
            z-index: 999;
        }

        .audio-bar .play-btn {
            background: none;
            border: none;
            color: var(--accent-atad);
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            transition: transform 0.2s;
        }

        .audio-bar .play-btn:hover {
            transform: scale(1.1);
        }

        .audio-bar .progress-container {
            flex: 1;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            position: relative;
            cursor: pointer;
        }

        .audio-bar .progress-bar {
            height: 100%;
            background: var(--primary-atad);
            border-radius: 3px;
            width: 0%;
            box-shadow: 0 0 10px rgba(46, 125, 50, 0.5);
        }

        .audio-bar .volume-container {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            width: 120px;
        }

        .audio-bar input[type="range"] {
            width: 100%;
            height: 4px;
            accent-color: var(--accent-atad);
            cursor: pointer;
        }

        /* Specialized Gallery Layout */
        .gallery-container {
            display: flex;
            flex-direction: column;
            gap: 25px;
            width: 100%;
        }

        .top-row {
            display: flex;
            flex-flow: row nowrap;
            gap: 25px;
            width: 100%;
        }

        .top-row .gallery-item {
            flex: 1;
            min-width: 0;
        }

        .bottom-row {
            width: 100%;
        }

        .bottom-row .gallery-item {
            width: 100%;
        }

        .gallery-item {
            border-radius: 20px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.05);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid transparent;
        }

        [data-theme="dark"] .gallery-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
        }

        .gallery-item:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
        }

        .gallery-item img {
            width: 100%;
            height: auto;
            object-fit: contain;
            display: block;
            background: #eee;
        }

        [data-theme="dark"] .gallery-item img {
            background: #000;
        }

        /* Flashcards Section */
        .flashcards-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .flashcard {
            height: 180px;
            perspective: 1000px;
            cursor: pointer;
        }

        .flashcard-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.05);
            border-radius: 16px;
        }

        .flashcard.flipped .flashcard-inner {
            transform: rotateY(180deg);
        }

        .flashcard-front,
        .flashcard-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
            border-radius: 16px;
            background: var(--bg-card);
            color: var(--text-main);
            font-weight: 600;
            border: 1px solid var(--border-color);
            font-size: 1rem;
        }

        .flashcard-back {
            background: linear-gradient(135deg, var(--primary-atad) 0%, #1b5e20 100%);
            color: white !important;
            transform: rotateY(180deg);
            border-color: transparent;
        }

        /* Intro Overlay */
        #intro-overlay {
            position: fixed;
            inset: 0;
            background: var(--primary-atad);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            color: white;
            transition: all 0.6s ease;
        }

        .start-btn {
            background: white;
            color: var(--primary-atad);
            border: none;
            padding: 1.25rem 3rem;
            border-radius: 100px;
            font-size: 1.25rem;
            font-weight: 800;
            cursor: pointer;
            margin-top: 2rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .start-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        /* Loader */
        .loader-bar {
            width: 240px;
            height: 6px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
            margin-top: 24px;
            overflow: hidden;
        }

        .loader-progress {
            width: 0%;
            height: 100%;
            background: white;
            transition: width 0.4s ease;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        @media (max-width: 768px) {
            .section-card {
                padding: 1.5rem;
            }

            .hero-title {
                font-size: 2.5rem;
            }

            .hero-section {
                height: 30vh;
            }

            .audio-bar {
                padding: 0 1rem;
                gap: 1rem;
            }

            .audio-bar .volume-container {
                display: none;
            }

            /* Hide volume on small screens */
        }
    </style>
</head>

<body>
    <div id="intro-overlay">
        <i class="fas fa-city fa-4x mb-4"></i>
        <h1 style="font-family:'Outfit'; text-transform:uppercase; letter-spacing:4px;">Nagyatád</h1>
        <p style="font-weight:600; opacity:0.8;">Bemutató összeállítása...</p>
        <div class="loader-bar">
            <div class="loader-progress" id="load-progress"></div>
        </div>
        <button class="start-btn" id="start-btn" style="display:none;">Indítás</button>
    </div>

    <header class="app-header">
        <a href="../../index.html" class="logo"><i class="fab fa-android"></i><span>IRODAI<br>ASSZISZTENS</span></a>
        <div class="header-info">
            <div id="header-weather"></div>
            <div id="global-clock"></div>
        </div>
    </header>

    <!-- Audio Player Bar (Copy of Gas Evaluator) -->
    <div class="audio-bar">
        <button id="audio-play-btn" class="play-btn"><i class="fas fa-play"></i></button>
        <div id="audio-progress-container" class="progress-container">
            <div id="audio-progress-bar" class="progress-bar"></div>
        </div>
        <div id="audio-time">0:00 / 0:00</div>
        <div class="volume-container">
            <i class="fas fa-volume-up"></i>
            <input type="range" id="audio-volume" min="0" max="1" step="0.1" value="0.8">
        </div>
    </div>

    <div class="hero-section">
        <h1 class="hero-title">Nagyatád<br><small>A NYUGALOM SZIGETE</small></h1>
    </div>

    <div class="content-container">
        <!-- Video Section -->
        <section class="section-card">
            <div class="section-header">
                <h2>Városfilm</h2>
                <p>Nagyatád, a parkok és a szobrok városa</p>
            </div>
            <video id="atad-video" controls poster="atad_assets/img1.png"></video>
        </section>

        <!-- Gallery Section -->
        <section class="section-card">
            <div class="section-header">
                <h2>Galéria</h2>
                <p>Életképek és tájak</p>
            </div>
            <div class="gallery-container">
                <div class="top-row">
                    <div class="gallery-item"><img src="atad_assets/img1.png" alt="Kép 1"></div>
                    <div class="gallery-item"><img src="atad_assets/img2.png" alt="Kép 2"></div>
                </div>
                <div class="bottom-row">
                    <div class="gallery-item"><img src="atad_assets/img3.png" alt="Kép 3"></div>
                </div>
            </div>
        </section>

        <!-- Quiz/Flashcards Section -->
        <section class="section-card">
            <div class="section-header">
                <h2>Ismerd meg jobban</h2>
                <p>Kattints a kártyákra az érdekességekért!</p>
            </div>
            <div class="flashcards-container" id="cards-container">
                <!-- JS Injected -->
            </div>
        </section>
    </div>

    <audio id="bg-audio" preload="auto" loop>
        <source src="atad_assets/bg_audio.m4a" type="audio/mp4">
    </audio>

    <!-- JS Injected Video Parts (4 parts now for even smaller files) -->
    <script src="atad_assets/video_part1.js"></script>
    <script src="atad_assets/video_part2.js"></script>
    <script src="atad_assets/video_part3.js"></script>
    <script src="atad_assets/video_part4.js"></script>

    <script src="../../js/main.js"></script>
    <script>
        const flashcardsData = [
            { q: "Melyik évben említik először Atád nevét?", a: "1190-ben." },
            { q: "Milyen eredetű a név?", a: "Török eredetű, jelentése: 'atya'." },
            { q: "Ki adott mezővárosi rangot 1475-ben?", a: "Hunyadi Mátyás király." },
            { q: "Mikor kapta vissza a városi rangját?", a: "1971. április 25-én." },
            { q: "Mikor fedezték fel a gyógyvizet?", a: "1906-ban." },
            { q: "Milyen mélyről tör fel a víz?", a: "410 méter mélyről." },
            { q: "Miért híres a Szoborpark?", a: "Közel 60 nagyméretű faplasztika található ott." },
            { q: "Melyik híres sportversenynek ad otthont?", a: "ExtremeMan Nagyatád triatlon." },
            { q: "Melyik évben kapott Hild-érmet?", a: "Kétszer도 elnyerte a városkép ápolásáért." },
            { q: "Hol található a Hadipark?", a: "A Széchenyi tér északi részén." }
        ];

        function base64ToBlob(base64, type = 'video/mp4') {
            const bin = atob(base64);
            const len = bin.length;
            const arr = new Uint8Array(len);
            for (let i = 0; i < len; i++) arr[i] = bin.charCodeAt(i);
            return new Blob([arr], { type });
        }

        async function initPage() {
            const overlay = document.getElementById('intro-overlay');
            const startBtn = document.getElementById('start-btn');
            const progress = document.getElementById('load-progress');
            const video = document.getElementById('atad-video');
            const audio = document.getElementById('bg-audio');

            // Audio Bar Controls
            const playBtn = document.getElementById('audio-play-btn');
            const playIcon = playBtn.querySelector('i');
            const progressBar = document.getElementById('audio-progress-bar');
            const progressContainer = document.getElementById('audio-progress-container');
            const timeDisplay = document.getElementById('audio-time');
            const volumeSlider = document.getElementById('audio-volume');

            // 1. Merge Video Chunks from JS Variables (Speed prioritized)
            try {
                const chunks = [];
                if (window.VIDEO_PART_1) {
                    chunks.push(base64ToBlob(window.VIDEO_PART_1));
                    progress.style.width = '25%';
                }
                if (window.VIDEO_PART_2) {
                    chunks.push(base64ToBlob(window.VIDEO_PART_2));
                    progress.style.width = '50%';
                }
                if (window.VIDEO_PART_3) {
                    chunks.push(base64ToBlob(window.VIDEO_PART_3));
                    progress.style.width = '75%';
                }
                if (window.VIDEO_PART_4) {
                    chunks.push(base64ToBlob(window.VIDEO_PART_4));
                    progress.style.width = '100%';
                }

                if (chunks.length < 4) throw new Error("A videó darabjai hiányoznak. Kérlek ellenőrizd a fájlokat!");

                const mergedBlob = new Blob(chunks, { type: 'video/mp4' });
                video.src = URL.createObjectURL(mergedBlob);
                startBtn.style.display = 'block';
                document.querySelector('#intro-overlay p').innerText = "Indításra kész!";
            } catch (e) {
                console.error("Critical loading error:", e);
                document.querySelector('#intro-overlay p').innerHTML = `<span style="color:#ffccbc;">Hiba: ${e.message}</span>`;
            }

            // 2. Audio/Video Sync logic
            video.addEventListener('play', () => {
                audio.pause();
                playIcon.className = 'fas fa-play';
            });

            video.addEventListener('pause', () => {
                // Return to background music if video is stopped
                audio.play().catch(() => { });
                playIcon.className = 'fas fa-pause';
            });

            video.addEventListener('ended', () => {
                audio.play().catch(() => { });
                playIcon.className = 'fas fa-pause';
            });

            // 3. Audio Bar Functionality
            playBtn.onclick = () => {
                if (audio.paused) {
                    audio.play();
                    playIcon.className = 'fas fa-pause';
                    if (!video.paused) video.pause();
                } else {
                    audio.pause();
                    playIcon.className = 'fas fa-play';
                }
            };

            audio.ontimeupdate = () => {
                const percent = (audio.currentTime / audio.duration) * 100;
                progressBar.style.width = percent + '%';

                const curM = Math.floor(audio.currentTime / 60);
                const curS = Math.floor(audio.currentTime % 60).toString().padStart(2, '0');
                const durM = Math.floor(audio.duration / 60) || 0;
                const durS = Math.floor(audio.duration % 60 || 0).toString().padStart(2, '0');

                timeDisplay.innerText = `${curM}:${curS} / ${durM}:${durS}`;
            };

            progressContainer.onclick = (e) => {
                const rect = progressContainer.getBoundingClientRect();
                const pos = (e.clientX - rect.left) / rect.width;
                audio.currentTime = pos * audio.duration;
            };

            volumeSlider.oninput = () => {
                audio.volume = volumeSlider.value;
            };

            // 4. Start Button Handlers
            startBtn.onclick = () => {
                overlay.style.opacity = '0';
                overlay.style.pointerEvents = 'none';
                setTimeout(() => overlay.style.display = 'none', 600);

                // Explicitly set volume and try to play
                audio.volume = volumeSlider.value;
                const playPromise = audio.play();

                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        playIcon.className = 'fas fa-pause';
                    }).catch(e => {
                        console.warn("Audio play blocked even after interaction:", e);
                        playIcon.className = 'fas fa-play';
                    });
                }
            };

            // 5. Render Flashcards
            const container = document.getElementById('cards-container');
            container.innerHTML = flashcardsData.map(d => `
                <div class="flashcard" onclick="this.classList.toggle('flipped')">
                    <div class="flashcard-inner">
                        <div class="flashcard-front">${d.q}</div>
                        <div class="flashcard-back">${d.a}</div>
                    </div>
                </div>
            `).join('');
        }

        document.addEventListener('DOMContentLoaded', initPage);
    </script>
</body>

</html>
