<!DOCTYPE html>
<html lang="hu" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helyi Időjárás - Irodai Asszisztens</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../css/main.css">
    <style>
        .radar-card {
            background: var(--bg-card);
            border-radius: 2rem;
            padding: 1.5rem;
            border: 1px solid var(--border-color);
            margin-bottom: 2rem;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .radar-frame {
            width: 100%;
            height: 500px;
            border-radius: 1rem;
            border: none;
        }

        .weather-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
        }

        .stat-card {
            background: var(--bg-card);
            border-radius: 1.5rem;
            padding: 1.5rem;
            border: 1px solid var(--border-color);
            text-align: center;
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 800;
            color: var(--primary);
            margin: 0.5rem 0;
        }

        .stat-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 1px;
        }
    </style>
</head>

<body>
    <header class="app-header">
        <a href="../../index.html" class="logo"><i class="fab fa-android"></i><span>IRODAI<br>ASSZISZTENS</span></a>
        <div class="header-info">
            <!-- Data injected by main.js -->
        </div>
    </header>

    <main class="container py-5 fade-in">
        <div class="d-flex justify-content-between align-items-center mb-5">
            <h2 style="font-family:'Outfit'; font-weight:800; margin:0;"><i
                    class="fas fa-temperature-high text-primary me-2"></i>Helyi Időjárás (Nagyatád)</h2>
        </div>

        <div class="weather-stats" style="max-width: 900px; margin-inline: auto; margin-top: 4rem;">
            <div class="stat-card">
                <i class="fas fa-thermometer-half fa-2x text-danger" style="margin-bottom: 1rem;"></i>
                <div id="weather-temp" class="stat-value">--°C</div>
                <div class="stat-label">Hőmérséklet</div>
            </div>
            <div class="stat-card">
                <i class="fas fa-wind fa-2x text-info" style="margin-bottom: 1rem;"></i>
                <div id="weather-wind" class="stat-value">-- km/h</div>
                <div class="stat-label">Szélsebesség</div>
            </div>
            <div class="stat-card">
                <i class="fas fa-tint fa-2x text-primary" style="margin-bottom: 1rem;"></i>
                <div id="weather-humid" class="stat-value">--%</div>
                <div class="stat-label">Páratartalom</div>
            </div>
            <div class="stat-card">
                <i class="fas fa-compress-arrows-alt fa-2x text-success" style="margin-bottom: 1rem;"></i>
                <div id="weather-press" class="stat-value">-- hPa</div>
                <div class="stat-label">Légnyomás</div>
            </div>
        </div>

        <div class="radar-card" style="max-width: 900px; margin-inline: auto; margin-top: 3rem;">
            <h4 style="font-family:'Outfit'; font-weight:800; margin-bottom:1.5rem;"><i
                    class="fas fa-chart-area text-primary me-2"></i>Hőmérsékleti grafikon (Nagyatád)</h4>
            <img src="https://www.idokep.hu/automata/omme_nagyatad_hom.png" alt="Nagyatád hőmérsékleti grafikon"
                style="width: 100%; border-radius: 1rem;">
            <div style="font-size: 0.7rem; color: var(--text-muted); margin-top: 1rem; text-align: right;">Forrás:
                Időkép.hu</div>
        </div>

        <div class="radar-card" style="max-width: 900px; margin-inline: auto; margin-top: 3rem;">
            <h4 style="font-family:'Outfit'; font-weight:800; margin-bottom:1.5rem;"><i
                    class="fas fa-droplet text-info me-2"></i>Csapadékmennyiség grafikon (Nagyatád)</h4>
            <img id="precip-graph" src="https://www.idokep.hu/automata/omme_nagyatad_csap.png"
                alt="Nagyatád csapadék grafikon" style="width: 100%; border-radius: 1rem;">
            <div style="font-size: 0.7rem; color: var(--text-muted); margin-top: 1rem; text-align: right;">Forrás:
                Időkép.hu</div>
        </div>




        <!-- Embedded Full Rinya Widget (INAKTÍV MIVEL A VÍZÜGYI SZERVER LETILTOTTA A LEKÉRDEZÉST) 
        <div class="radar-card" style="max-width: 900px; margin-inline: auto; margin-top: 3rem; padding: 0; overflow: hidden; border: 2px solid var(--primary); box-shadow: 0 0 20px rgba(123, 97, 255, 0.2);">
            <div style="padding: 1rem 1.5rem; background: var(--bg-card); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between;">
                <h4 style="font-family:'Outfit'; font-weight:800; margin:0;"><i class="fas fa-chart-line text-primary me-2"></i>Rinya Vízállás Monitor</h4>
            </div>
            <iframe src="./vizallas.html" style="width: 100%; height: 600px; border: none;" title="Rinya Vízállás Widget"></iframe>
        </div>
        -->
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="../../js/live_data.js"></script>
    <script src="../../js/main.js"></script>

</body>

</html>
