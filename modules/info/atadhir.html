<!DOCTYPE html>
<html lang="hu" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atádi Hírek - Irodai Asszisztens</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Outfit:wght@400;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../css/main.css">
    <style>
        .news-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        .news-item {
            padding: 15px 0;
            border-bottom: 1px solid var(--border-color, rgba(0, 0, 0, 0.1));
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            text-decoration: none !important;
            color: var(--text-color, #111) !important;
            transition: opacity 0.2s;
        }

        .news-item:hover {
            opacity: 0.7;
        }

        .news-title {
            font-weight: 700;
            font-size: 1.1rem;
            line-height: 1.4;
            flex: 1;
            color: var(--text-color, #111);
        }

        .news-date {
            font-size: 0.85rem;
            color: var(--text-muted, #666);
            white-space: nowrap;
            font-family: 'Outfit';
        }

        /* Sötét mód explicit fallback */
        [data-theme="dark"] .news-item,
        [data-theme="dark"] .news-title,
        [data-theme="dark"] .news-date {
            color: #f0f0f0 !important;
        }

        [data-theme="dark"] .news-item {
            border-bottom-color: rgba(255, 255, 255, 0.1) !important;
        }

        .flash-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 3px solid var(--primary);
            padding-bottom: 10px;
        }

        .btn-sync {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }

        #status-msg {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 5px;
        }
    </style>
</head>

<body>
    <header class="app-header">
        <a href="../../index.html" class="logo"><i class="fab fa-android"></i><span>IRODAI<br>ASSZISZTENS</span></a>
        <div class="header-info">
            <div id="header-weather"></div>
            <div id="global-clock"></div>
        </div>
    </header>

    <main class="news-container fade-in">
        <div class="flash-header">
            <h2 style="margin:0; font-weight:800; letter-spacing:-1px;">ATÁDI HÍREK</h2>
            <button class="btn-sync" onclick="syncNews()"><i class="fas fa-sync-alt" id="sync-icon"></i>
                FRISSÍTÉS</button>
        </div>

        <div id="news-list">
            <div class="loading-text">Betöltés...</div>
        </div>
        <div id="status-msg"></div>
    </main>

    <script>
        // Emergency Data Booster (Instant Load)
        window.LIVE_DATA = {
            news: [
                { title: "Farsangi kavalkád a nagyatádi általános iskolákban", date: "2026.02.10.", link: "https://www.atadhir.hu/hirek/nagyatad/farsangi-kavalkad-a-nagyatadi-altalanos-iskolakban/" },
                { title: "Megkezdték a fák metszését és a zöldterületek takarítását a városban", date: "2026.02.12.", link: "https://www.atadhir.hu/hirek/nagyatad/megkezdtek-a-fak-metszeset-es-a-zoldteruletek-takaritasat-a-varosban/" },
                { title: "Tavaszi lomtalanítás lesz Nagyatádon", date: "2026.02.08.", link: "https://www.atadhir.hu/hirek/tavaszi-lomtalanitas-nagyatadon/" },
                { title: "Pályaorientációs napot tartottak a NASZI-ban", date: "2026.02.09.", link: "https://www.atadhir.hu/hirek/nagyatad/palyaorientacios-napot-tartottak-a-naszi-ban/" },
                { title: "Látogatási tilalom lépett érvénybe a Nagyatádi Kórházban", date: "2026.02.02.", link: "https://www.atadhir.hu/hirek/latogatasi-tilalom-es-kotelezo-maszkviseles-lepett-ervenybe-a-nagyatadi-korhazban/" }
            ]
        };
    </script>
    <script src="../../js/main.js"></script>
    <script>
        const newsListEl = document.getElementById('news-list');
        const syncIcon = document.getElementById('sync-icon');
        const statusMsg = document.getElementById('status-msg');

        function renderNews(data) {
            if (!data || data.length === 0) return;
            newsListEl.innerHTML = data.map(item => `
                <a href="${item.link}" target="_blank" class="news-item">
                    <span class="news-title">${item.title}</span>
                    <span class="news-date">${item.date}</span>
                </a>
            `).join('');
        }

        async function syncNews() {
            syncIcon.classList.add('fa-spin');
            statusMsg.innerText = "Adatok lekérése az atadhir.hu-ról...";

            try {
                const targetUrl = 'https://www.atadhir.hu/nagyatad/';
                const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;

                const response = await fetch(proxyUrl);
                const json = await response.json();

                if (json.contents) {
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(json.contents, 'text/html');
                    const items = doc.querySelectorAll('.ultp-block-item, .post-item, .entry-title');

                    if (items.length > 0) {
                        const freshNews = [];
                        items.forEach((item, i) => {
                            if (freshNews.length >= 10) return;

                            const linkEl = item.querySelector('a') || (item.tagName === 'A' ? item : null);
                            if (!linkEl) return;

                            const titleEl = item.querySelector('h2, h3, .title, .entry-title') || linkEl;
                            const title = titleEl.innerText.trim();
                            const link = linkEl.href;

                            if (!title || !link || link.includes('javascript:') || title.length < 5) return;

                            let date = 'Friss';
                            const dateEl = item.querySelector('.updated, .published, .date, .post-date');
                            if (dateEl) {
                                date = dateEl.innerText.trim();
                            } else {
                                const imgEl = item.querySelector('img');
                                const dateMatch = imgEl?.src?.match(/atadhir(\d{4})(\d{2})(\d{2})/);
                                if (dateMatch) date = `${dateMatch[1]}.${dateMatch[2]}.${dateMatch[3]}.`;
                            }

                            if (!freshNews.some(n => n.link === link)) {
                                freshNews.push({ title, link, date });
                            }
                        });

                        if (freshNews.length > 0) {
                            renderNews(freshNews);
                            localStorage.setItem('cache_atadhir_min', JSON.stringify({ data: freshNews, timestamp: Date.now() }));
                            statusMsg.innerText = "Frissítve: " + new Date().toLocaleTimeString();
                        } else throw new Error("Nem található hír");
                    } else throw new Error("Üres válasz");
                }
            } catch (e) {
                console.error("Fetch error", e);
                statusMsg.innerText = "Hiba történt a frissítéskor.";
            } finally {
                syncIcon.classList.remove('fa-spin');
            }
        }

        // Init
        document.addEventListener('DOMContentLoaded', () => {
            // 1. Show Booster immediately
            renderNews(window.LIVE_DATA.news);

            // 2. Try Cache
            const cache = localStorage.getItem('cache_atadhir_min');
            if (cache) {
                const { data, timestamp } = JSON.parse(cache);
                if (Date.now() - timestamp < 1800000) { // 30 min cache
                    renderNews(data);
                }
            }

            // 3. Silent update
            syncNews();
        });
    </script>
</body>

</html>
