<!DOCTYPE html>
<html lang="hu" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check-lista - Irodai Asszisztens</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Outfit:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../css/main.css">
    <style>
        .checklist-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1rem; }
        .list-card { background: var(--bg-card); border-radius: 12px; padding: 1.25rem; border: 1px solid var(--border); }
        .list-card h4 { margin-bottom: 0.75rem; font-family: var(--font-title); font-weight: 800; font-size: 0.8rem; color: var(--accent); border-bottom: 2px solid var(--accent); display: inline-block; padding-bottom: 2px; }
        .todo-item { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem; font-size: 0.75rem; font-weight: 600; }
        .todo-item input[type="checkbox"] { width: 14px; height: 14px; cursor: pointer; accent-color: var(--accent); }
        .add-task-btn { width: 100%; padding: 0.4rem; border-radius: 6px; border: 1px dashed var(--border); background: transparent; color: var(--text-muted); cursor: pointer; font-size: 0.7rem; margin-top: 0.5rem; transition: 0.2s; }
        .add-task-btn:hover { border-color: var(--accent); color: var(--accent); }
        .export-btn { background: var(--accent); color: #fff; border: none; padding: 0.5rem 1rem; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 0.75rem; display: flex; align-items: center; gap: 0.5rem; }
    </style>
</head>

<body>
    <header class="app-header">
        <a href="../../index.html" class="logo">
            <i class="fab fa-android"></i>
            <span>IRODAI<br>ASSZISZTENS</span>
        </a>
        <nav class="app-nav">
            <div class="nav-cat">Energetika</div>
            <div class="nav-cat">Eszközök</div>
            <div class="nav-cat">Információ</div>
        </nav>
        <div class="header-info"></div>
    </header>

    <main class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
            <h2 class="section-title"><i class="fas fa-list-check"></i> Check-lista</h2>
            <button class="export-btn" onclick="exportPDF()"><i class="fas fa-file-pdf"></i> Export (PDF)</button>
        </div>

        <div id="capture-area" class="checklist-grid">
            <div class="list-card">
                <h4>Napi</h4>
                <div id="list-daily"></div>
                <button class="add-task-btn" onclick="addItem('daily')">+ Új feladat</button>
            </div>
            <div class="list-card">
                <h4>Heti</h4>
                <div id="list-weekly"></div>
                <button class="add-task-btn" onclick="addItem('weekly')">+ Új feladat</button>
            </div>
            <div class="list-card">
                <h4>Havi</h4>
                <div id="list-monthly"></div>
                <button class="add-task-btn" onclick="addItem('monthly')">+ Új feladat</button>
            </div>
            <div class="list-card">
                <h4>Éves</h4>
                <div id="list-yearly"></div>
                <button class="add-task-btn" onclick="addItem('yearly')">+ Új feladat</button>
            </div>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="../../js/main.js"></script>
    <script>
        const tasks = {
            daily: ["Fűtés ellenőrzése", "Közműcsatlakozási kérelmek", "Távleolvasás", "Közvilágítási hibák"],
            weekly: ["Fűtési intervallumok", "Napelemek felügyelete", "E-közmű ellenőrzés"],
            monthly: ["Jelentés leadása", "Bérlői elszámolások", "Diktálások (E2)", "Számla igazolás"],
            yearly: ["Molinók (augusztus)", "Tűzoltó készülékek", "Energetikai felülvizsgálat", "Éves jelentések"]
        };

        function render() {
            Object.keys(tasks).forEach(key => {
                const cont = document.getElementById(`list-${key}`);
                cont.innerHTML = tasks[key].map(t => `<div class="todo-item"><input type="checkbox"><span>${t}</span></div>`).join('');
            });
        }

        function addItem(type) {
            const task = prompt('Új feladat:');
            if (task) { tasks[type].push(task); render(); }
        }

        function exportPDF() {
            const element = document.getElementById('capture-area');
            const opt = { margin: 10, filename: 'Checklist.pdf', image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2 }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' } };
            html2pdf().from(element).set(opt).save();
        }
        render();
    </script>
</body>
</html>
