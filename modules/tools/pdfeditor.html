<!DOCTYPE html>
<html lang="hu" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF szerkesztő - Irodai Asszisztens</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Outfit:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../css/main.css">
    <style>
        .edit-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; }
        .edit-card { background: var(--bg-card); border-radius: 12px; padding: 2rem; border: 1px solid var(--border); }
        .file-list { margin-top: 1.5rem; border: 1px solid var(--border); border-radius: 8px; min-height: 80px; padding: 0.5rem; }
        .file-item { display: flex; align-items: center; justify-content: space-between; padding: 0.5rem 1rem; background: var(--bg-hover); margin-bottom: 0.5rem; border-radius: 6px; font-size: 0.8rem; }
        .btn-action { width: 100%; margin-top: 1.5rem; padding: 1rem; border-radius: 10px; border: none; background: var(--accent); color: white; font-weight: 800; cursor: pointer; transition: 0.2s; }
        .btn-action:hover { filter: brightness(1.1); }
    </style>
</head>

<body>
    <header class="app-header">
        <a href="../../index.html" class="logo">
            <i class="fab fa-android"></i>
            <span>IRODAI<br>ASSZISZTENS</span>
        </a>
        <nav class="app-nav">
            <div class="nav-cat">Energetika</div>
            <div class="nav-cat">Eszközök</div>
            <div class="nav-cat">Információ</div>
        </nav>
        <div class="header-info"></div>
    </header>

    <main class="container">
        <h2 class="section-title" style="margin-bottom: 2rem;"><i class="fas fa-file-pdf"></i> PDF Szerkesztő</h2>

        <div class="edit-layout">
            <div class="edit-card">
                <h4 style="margin-bottom:1rem;"><i class="fas fa-layer-group"></i> PDF Összeillesztés</h4>
                <p style="font-size: 0.75rem; color: var(--text-muted); margin-bottom: 1rem;">Válasszon ki több PDF fájlt az egyesítéshez.</p>
                <input type="file" id="merge-input" multiple accept="application/pdf" style="display:none;" onchange="updateList('merge')">
                <button class="neo-shiny-btn" style="width:100%; border-style:dashed;" onclick="document.getElementById('merge-input').click()">+ Fájlok hozzáadása</button>
                <div class="file-list" id="merge-list"></div>
                <button class="btn-action" onclick="mergePDFs()">EGYESÍTÉS ÉS LETÖLTÉS</button>
            </div>

            <div class="edit-card">
                <h4 style="margin-bottom:1rem;"><i class="fas fa-scissors"></i> PDF Darabolás</h4>
                <p style="font-size: 0.75rem; color: var(--text-muted); margin-bottom: 1rem;">Válasszon egy PDF-et és adja meg az oldalszámokat.</p>
                <input type="file" id="split-input" accept="application/pdf" style="display:none;" onchange="updateList('split')">
                <button class="neo-shiny-btn" style="width:100%; border-style:dashed;" onclick="document.getElementById('split-input').click()">Fájl kiválasztása</button>
                <div class="file-list" id="split-list"></div>
                <div style="margin-top: 1rem;">
                    <label style="font-size: 0.6rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase;">Tartomány (pl: 1-3, 5, 8-10)</label>
                    <input type="text" id="split-range" style="width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid var(--border); outline: none;" placeholder="1-2, 4...">
                </div>
                <button class="btn-action" style="background:var(--primary);" onclick="splitPDF()">OLDALAK KINYERÉSE</button>
            </div>
        </div>
    </main>

    <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="../../js/main.js"></script>
    <script>
        let mergeFiles = [];
        let splitFile = null;

        function updateList(type) {
            if (type === 'merge') {
                const input = document.getElementById('merge-input');
                mergeFiles = Array.from(input.files);
                const list = document.getElementById('merge-list');
                list.innerHTML = mergeFiles.map(f => `<div class="file-item"><span>${f.name}</span> <i class="fas fa-file-pdf"></i></div>`).join('');
            } else {
                splitFile = document.getElementById('split-input').files[0];
                document.getElementById('split-list').innerHTML = `<div class="file-item"><span>${splitFile.name}</span> <i class="fas fa-file-pdf"></i></div>`;
            }
        }

        async function mergePDFs() {
            if (mergeFiles.length < 2) return alert("Hiba: Legalább 2 fájl szükséges.");
            const mergedPdf = await PDFLib.PDFDocument.create();
            for (const f of mergeFiles) {
                const pdf = await PDFLib.PDFDocument.load(await f.arrayBuffer());
                const copiedPages = await mergedPdf.copyPages(pdf, pdf.getPageIndices());
                copiedPages.forEach((page) => mergedPdf.addPage(page));
            }
            const pdfBytes = await mergedPdf.save();
            download(pdfBytes, 'Osszeillesztett.pdf');
        }

        async function splitPDF() {
            if (!splitFile) return alert("Válasszon fájlt!");
            const rangeStr = document.getElementById('split-range').value;
            if (!rangeStr) return alert("Adjon meg oldaltartományt!");

            try {
                const existingPdf = await PDFLib.PDFDocument.load(await splitFile.arrayBuffer());
                const pageCount = existingPdf.getPageCount();
                const pagesToExtract = [];

                const parts = rangeStr.split(',');
                parts.forEach(part => {
                    if (part.includes('-')) {
                        const [start, end] = part.split('-').map(p => parseInt(p.trim()));
                        if (!isNaN(start) && !isNaN(end)) {
                            for (let i = start; i <= end; i++) {
                                if (i > 0 && i <= pageCount) pagesToExtract.push(i - 1);
                            }
                        }
                    } else {
                        const page = parseInt(part.trim());
                        if (!isNaN(page) && page > 0 && page <= pageCount) {
                            pagesToExtract.push(page - 1);
                        }
                    }
                });

                if (pagesToExtract.length === 0) return alert("Hiba: Érvénytelen oldalszámok.");

                const uniquePages = [...new Set(pagesToExtract)].sort((a, b) => a - b);
                const newPdf = await PDFLib.PDFDocument.create();
                const copiedPages = await newPdf.copyPages(existingPdf, uniquePages);
                copiedPages.forEach(p => newPdf.addPage(p));

                const pdfBytes = await newPdf.save();
                download(pdfBytes, 'Darabolt.pdf');
            } catch (err) {
                console.error(err);
                alert("Hiba történt.");
            }
        }

        function download(bytes, name) {
            const blob = new Blob([bytes], { type: "application/pdf" });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = name;
            link.click();
        }
    </script>
</body>

</html>
