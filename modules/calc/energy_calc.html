<!DOCTYPE html>
<html lang="hu" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Energiaszámla Kalkulátor - Irodai Asszisztens</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../css/main.css">
    <style>
        .calc-card {
            background: var(--bg-card);
            border-radius: 1.5rem;
            padding: 2.5rem;
            max-width: 600px;
            margin: 2rem auto;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }

        .provider-tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .tab-btn {
            flex: 1;
            padding: 0.75rem;
            border-radius: 0.75rem;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            font-weight: 800;
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.8rem;
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-weight: 800;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .styled-input,
        .styled-select {
            width: 100%;
            padding: 1rem;
            border-radius: 1rem;
            border: 2px solid var(--border-color);
            background: var(--bg-light);
            color: var(--text-main);
            font-size: 1.1rem;
            font-weight: 600;
        }

        .result-box {
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent-purple) 100%);
            color: white;
            padding: 2rem;
            border-radius: 1.5rem;
            text-align: center;
            margin-top: 2rem;
            box-shadow: 0 10px 20px rgba(123, 97, 255, 0.3);
        }

        .result-box h4 {
            font-size: 0.8rem;
            margin-bottom: 0.5rem;
            opacity: 0.9;
        }

        .result-box .value {
            font-size: 2.5rem;
            font-weight: 800;
        }

        #e2-sub-tabs {
            display: none;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            justify-content: center;
            background: rgba(0, 0, 0, 0.02);
            padding: 0.75rem;
            border-radius: 1rem;
        }
    </style>
</head>

<body>
    <header class="app-header">
        <a href="../../index.html" class="logo"><i class="fab fa-android"></i><span>IRODAI<br>ASSZISZTENS</span></a>
        <div class="header-info">
            <div id="header-weather"></div>
            <div id="global-clock"></div>
        </div>
    </header>

    <main class="container py-4">
        <div class="module-header text-center mb-4">
            <h2 class="section-title"><i class="fas fa-file-invoice-dollar text-primary me-2"></i>Energiaszámla
                Kalkulátor</h2>
            <p class="text-muted">Összetett kalkulátor szolgáltatói (MVM, E.ON, E2) tarifákkal</p>
        </div>

        <div class="calc-card fade-in">
            <div class="provider-tabs">
                <button class="tab-btn active" onclick="setProvider('MVM', this)">MVM</button>
                <button class="tab-btn" onclick="setProvider('EON', this)">E.ON</button>
                <button class="tab-btn" onclick="setProvider('E2', this)">E2</button>
            </div>

            <div id="e2-sub-tabs">
                <button class="tab-btn" onclick="setE2Sub('gaz', this)">Gáz (Tőzsde)</button>
                <button class="tab-btn" onclick="setE2Sub('aram', this)">Áram (Tőzsde)</button>
            </div>

            <div class="form-group">
                <label>Fogyasztás mértéke</label>
                <div style="display: flex; gap: 0.5rem;">
                    <input type="number" id="bill-amount" class="styled-input" style="flex: 2;" oninput="calcBill()"
                        value="1000">
                    <select id="bill-unit" class="styled-select" style="flex: 1;" onchange="calcBill()">
                        <option value="kwh">kWh</option>
                        <option value="m3">m³</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Egységár (Nettó Ft)</label>
                <div style="display: flex; gap: 0.5rem;">
                    <input type="number" id="unit-price" class="styled-input" style="flex: 2;" oninput="calcBill()">
                    <select id="price-unit" class="styled-select" style="flex: 1;" onchange="calcBill()">
                        <option value="kwh">Ft / kWh</option>
                        <option value="m3">Ft / m³</option>
                    </select>
                </div>
            </div>

            <div class="result-box">
                <h4>Várható Bruttó Összeg (27% ÁFA)</h4>
                <div class="value" id="bill-res">0 Ft</div>
            </div>
        </div>
    </main>

    <script src="../../js/main.js"></script>
    <script>
        const providerData = {
            MVM: { price: 10.20, unit: 'kwh' },
            EON: { price: 10.30, unit: 'kwh' },
            E2: { price: 10.15, unit: 'kwh' }
        };
        let currentP = 'MVM';

        function setProvider(p, btn) {
            currentP = p;
            document.querySelectorAll('.provider-tabs .tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            const e2Sub = document.getElementById('e2-sub-tabs');
            if (p === 'E2') {
                e2Sub.style.display = 'flex';
                e2Sub.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            } else {
                e2Sub.style.display = 'none';
                document.getElementById('unit-price').value = providerData[p].price;
                document.getElementById('price-unit').value = providerData[p].unit;
                calcBill();
            }
        }

        function setE2Sub(type, btn) {
            document.querySelectorAll('#e2-sub-tabs .tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            if (type === 'gaz') {
                document.getElementById('unit-price').value = 4.82;
                document.getElementById('price-unit').value = 'kwh';
            } else {
                document.getElementById('unit-price').value = 52.4;
                document.getElementById('price-unit').value = 'kwh';
            }
            calcBill();
        }

        function calcBill() {
            const amount = parseFloat(document.getElementById('bill-amount').value) || 0;
            const price = parseFloat(document.getElementById('unit-price').value) || 0;
            const total = amount * price * 1.27;
            document.getElementById('bill-res').innerText = Math.round(total).toLocaleString('hu-HU') + ' Ft';
        }

        // Init
        document.getElementById('unit-price').value = providerData.MVM.price;
        calcBill();
    </script>
</body>

</html>
