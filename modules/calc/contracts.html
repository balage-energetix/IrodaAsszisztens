<!DOCTYPE html>
<html lang="hu" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Szerződések - Irodai Asszisztens</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Outfit:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../css/main.css">
    <style>
        .view-sel { display: flex; gap: 0.75rem; margin-bottom: 1.5rem; justify-content: center; }
        .sub-sel { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; justify-content: center; }
        
        .contract-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        .contract-table th, .contract-table td { padding: 0.75rem; text-align: left; border-bottom: 1px solid var(--border); }
        .contract-table th { background: var(--bg-hover); font-weight: 800; color: var(--accent); text-transform: uppercase; font-size: 0.7rem; }
        
        .tag { padding: 0.2rem 0.6rem; border-radius: 4px; font-size: 0.65rem; font-weight: 800; color: white; cursor: pointer; border: none; }
        .tag-elec { background: #fbc02d; }
        .tag-gas { background: #ff7043; }
        .tag-water { background: #29b6f6; }
        
        .btn-view { padding: 0.5rem 1rem; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text-main); font-size: 0.75rem; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .btn-view.active { background: var(--accent); color: white; border-color: var(--accent); }
    </style>
</head>

<body class="module-body">
    <div class="module-container">
        <header class="module-header">
            <div class="module-title">
                <i class="fas fa-file-contract"></i>
                <span>Szerződés Nyilvántartó</span>
            </div>
            <a href="../../index.html" class="module-back">
                <i class="fas fa-arrow-left"></i>
                Vissza a főoldalra
            </a>
        </header>

        <div class="module-content">
            <div class="view-sel">
                <button class="btn-view active" id="btn-energy" onclick="switchMainView('energy')">Energiakereskedelmi Szerződések</button>
                <button class="btn-view" id="btn-other" onclick="switchMainView('other')">Hálózattulajdonos és Egyéb</button>
            </div>

            <div id="energy-sub-sel" class="sub-sel">
                <button class="tag tag-elec" onclick="filterEnergy('villamosenergia')">Villamosenergia</button>
                <button class="tag tag-gas" onclick="filterEnergy('foldgaz')">Földgáz</button>
                <button class="tag tag-water" onclick="filterEnergy('ivoviz')">Ivóvíz</button>
            </div>

            <div class="module-card">
                <div class="module-card-title">Aktuális szerződések listája</div>
                <div style="overflow-x: auto;">
                    <table class="contract-table">
                        <thead>
                            <tr>
                                <th>Intézménynév</th>
                                <th>Cím</th>
                                <th>POD Azonosító</th>
                                <th>Várható Fogyasztás</th>
                                <th>ID</th>
                                <th>Egységár</th>
                                <th>Lejárat</th>
                                <th>Felmondás</th>
                            </tr>
                        </thead>
                        <tbody id="contracts-body">
                            <!-- Data injected here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="../../js/main.js"></script>
    <script>
        const energyData = [
            { type: 'villamosenergia', name: 'Városháza', addr: 'Baross G. u. 9.', pod: 'HU0001...', cons: '125 000 kWh', id: 'SZ-2024-V01', price: '68.5 Ft/kWh', term: '2024.12.31', notice: '3 hónap' },
            { type: 'foldgaz', name: 'Kulturális Központ', addr: 'Széchenyi tér 1.', pod: 'GAN002...', cons: '45 000 m3', id: 'SZ-2024-G05', price: '185 Ft/m3', term: '2025.10.01', notice: '6 hónap' },
            { type: 'ivoviz', name: 'Sportcsarnok', addr: 'Sport u. 2.', pod: 'WTR998...', cons: '12 000 m3', id: 'SZ-2024-W12', price: '420 Ft/m3', term: 'Határozatlan', notice: '30 nap' }
        ];

        const otherData = [
            { name: 'E.ON Észak-dunántúli Áramhálózati Zrt.', addr: 'Hálózati hozzáférés', pod: 'KIF III', cons: 'N/A', id: 'H-2024-01-EL', price: 'Díj szerint', term: 'Határozatlan', notice: 'N/A' },
            { name: 'DRV Zrt.', addr: 'Vízmű hálózat', pod: 'N/A', cons: 'N/A', id: 'H-2024-02-WI', price: 'Díj szerint', term: 'Határozatlan', notice: 'N/A' }
        ];

        function render(data) {
            const body = document.getElementById('contracts-body');
            body.innerHTML = data.map(d => `
                <tr>
                    <td style="font-weight:700;">${d.name}</td>
                    <td>${d.addr}</td>
                    <td><code>${d.pod}</code></td>
                    <td>${d.cons}</td>
                    <td>${d.id}</td>
                    <td style="color:var(--accent); font-weight:700;">${d.price}</td>
                    <td>${d.term}</td>
                    <td>${d.notice}</td>
                </tr>
            `).join('');
        }

        function switchMainView(view) {
            document.getElementById('btn-energy').classList.toggle('active', view === 'energy');
            document.getElementById('btn-other').classList.toggle('active', view === 'other');
            document.getElementById('energy-sub-sel').style.display = view === 'energy' ? 'flex' : 'none';
            render(view === 'energy' ? energyData : otherData);
        }

        function filterEnergy(type) {
            const filtered = energyData.filter(d => d.type === type);
            render(filtered);
        }

        switchMainView('energy');
    </script>
</body>
</html>
