    <style>
        .search-bar {
            width: 100%;
            max-width: 600px;
            margin: 0 auto 2rem;
            position: relative;
        }

        .search-bar input {
            width: 100%;
            padding: 1rem 1rem 1rem 3.5rem;
            border-radius: 1.5rem;
            border: 2px solid var(--border-color);
            background: var(--bg-card);
            font-size: 1.1rem;
            transition: var(--transition);
        }

        .search-bar input:focus {
            border-color: var(--primary);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            outline: none;
        }

        .search-bar i {
            position: absolute;
            left: 1.5rem;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.25rem;
            color: var(--text-muted);
        }

        .directory-card {
            background: var(--bg-card);
            border-radius: 1.5rem;
            padding: 2rem;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
            text-align: left;
        }

        th {
            font-weight: 800;
            color: var(--primary);
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.05rem;
        }

        tr:hover {
            background: var(--bg-light);
        }

        .phone-link {
            color: var(--primary);
            font-weight: 800;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .phone-link:hover {
            text-decoration: underline;
        }

        /* Hide the globally injected back button as there is already one in the module header */
        .sub-nav-bar {
            display: none !important;
        }
    </style>
</head>

        function render(data) {
            const query = document.getElementById('search').value.toLowerCase();
            const body = document.getElementById('directory-body');

            const highlightText = (text) => {
                if (!query) return text;
                const regex = new RegExp(`(${query})`, 'gi');
                return String(text).replace(regex, '<span class="neon-text-highlight">$1</span>');
            };

            const highlightPhone = (phone, isVisible) => {
                let html = phone;
                // If the query matches anything in the entry, we highlight the last 3 digits
                if (query && isVisible) {
                    const last3 = phone.slice(-3);
                    html = phone.slice(0, -3) + `<span class="neon-text-highlight">${last3}</span>`;
                }
                return html;
            };

            body.innerHTML = data.map(m => {
                const isMatch = query && (
                    m.p.toLowerCase().includes(query) ||
                    m.n.toLowerCase().includes(query) ||
                    m.t.includes(query) ||
                    m.e.toLowerCase().includes(query)
                );

                return `
                    <tr>
                        <td style="font-weight:700;">${highlightText(m.p)}</td>
                        <td>${highlightText(m.n)}</td>
                        <td><a href="tel:${m.t.replace(/\s/g, '')}" class="phone-link"><i class="fas fa-phone-alt"></i> ${highlightPhone(m.t, isMatch)}</a></td>
                        <td><a href="mailto:${m.e}" class="phone-link" style="color: var(--secondary); font-size: 0.85rem;"><i class="fas fa-envelope"></i> ${highlightText(m.e)}</a></td>
                    </tr>
                `;
            }).join('');
        }

        function filter() {
            const query = document.getElementById('search').value.toLowerCase();
            const filtered = members.filter(m =>
                m.p.toLowerCase().includes(query) ||
                m.n.toLowerCase().includes(query) ||
                m.t.includes(query) ||
                m.e.toLowerCase().includes(query)
            );
            render(filtered);
        }

        render(members);
    </script>
