<!DOCTYPE html>
<html lang="hu" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bérlők - Irodai Asszisztens</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Outfit:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="../../css/main.css">
    <style>
        .tenant-selector { display: flex; gap: 0.75rem; margin-bottom: 2rem; flex-wrap: wrap; justify-content: center; }
        .type-pill { padding: 0.6rem 1.25rem; border-radius: 6px; background: var(--bg-card); border: 1px solid var(--border); cursor: pointer; font-weight: 700; font-size: 0.75rem; transition: 0.2s; display: flex; align-items: center; gap: 0.5rem; color: var(--text-muted); }
        .type-pill.active { background: var(--accent); color: white; border-color: var(--accent); box-shadow: 0 4px 10px rgba(59, 130, 246, 0.2); }
        
        .search-box { position: relative; margin-bottom: 1.5rem; }
        .search-box i { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 0.8rem; }
        .search-box input { width: 100%; padding: 0.7rem 1rem 0.7rem 2.5rem; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-hover); font-size: 0.8rem; outline: none; transition: 0.2s; color: var(--text-main); }
        .search-box input:focus { border-color: var(--accent); background: var(--bg-card); }
        
        .tenant-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
        .tenant-table th { text-align: left; padding: 0.75rem; background: var(--bg-hover); font-weight: 800; color: var(--accent); text-transform: uppercase; font-size: 0.65rem; border-bottom: 2px solid var(--border); }
        .tenant-table td { padding: 0.75rem; border-bottom: 1px solid var(--border); }
        
        .pod-pill { background: rgba(59, 130, 246, 0.1); color: var(--accent); padding: 0.2rem 0.5rem; border-radius: 4px; font-family: monospace; font-weight: 700; font-size: 0.7rem; }
        .status-badge { display: inline-flex; align-items: center; padding: 0.2rem 0.6rem; border-radius: 4px; font-size: 0.65rem; font-weight: 800; }
        .status-ok { background: #dcfce7; color: #166534; }
    </style>
</head>

<body class="module-body">
    <div class="module-container" style="max-width: 1200px;">
        <header class="module-header">
            <div class="module-title">
                <i class="fas fa-users-viewfinder"></i>
                <span>Bérlői Elszámolások</span>
            </div>
            <div style="display: flex; gap: 0.75rem; align-items: center;">
                <button class="btn-premium" style="padding: 0.4rem 0.75rem; font-size: 0.65rem;" onclick="exportPDF()">
                    <i class="fas fa-file-pdf"></i> PDF EXPORT
                </button>
                <a href="../../index.html" class="module-back">
                    <i class="fas fa-arrow-left"></i> Vissza
                </a>
            </div>
        </header>

        <div class="module-content">
            <div class="tenant-selector" id="type-selector">
                <div class="type-pill active" onclick="switchType('ELECTRIC', this)"><i class="fas fa-bolt"></i> Villamosenergia</div>
                <div class="type-pill" onclick="switchType('GAS', this)"><i class="fas fa-fire"></i> Földgáz</div>
                <div class="type-pill" onclick="switchType('WATER', this)"><i class="fas fa-droplet"></i> Víz / Csatorna</div>
            </div>

            <div class="module-card">
                <div class="module-card-title">Helyszíni elszámolások státusza</div>
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="tenant-search" placeholder="Keresés helyszín vagy POD alapján..." oninput="filterTable()">
                </div>
                <div style="overflow-x: auto;">
                    <table class="tenant-table">
                        <thead>
                            <tr>
                                <th>Helyszín</th>
                                <th>Bérlő Neve</th>
                                <th>POD Azonosító</th>
                                <th>Mérőóra</th>
                                <th>Utolsó Állás</th>
                                <th>Bizonylat</th>
                                <th>Záródátum</th>
                            </tr>
                        </thead>
                        <tbody id="tenant-body">
                            <!-- Content injected by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="../../js/main.js"></script>
    <script>
        const tenantData = [
            { t: 'ELECTRIC', l: 'Ady E. u. 1/a ép.', b: 'Városi Könyvtár', p: 'HU000120-11-S-4331', s: '83921029', v: '12402 kWh', n: 'RF-2024/011', d: '2024.12.31' },
            { t: 'ELECTRIC', l: 'Baross Gábor utca 1', b: 'Tourinform Iroda', p: 'HU000120-11-S-9807', s: '72819201', v: '4521 kWh', n: 'RF-2024/012', d: '2024.12.31' },
            { t: 'ELECTRIC', l: 'Széchenyi tér 25.', b: 'Múzeum Kávézó', p: 'HU000120-11-S-4899', s: '99201822', v: '89201 kWh', n: 'RF-2024/015', d: '2024.11.20' },
            { t: 'GAS', l: 'Árpád utca 1.', b: 'Helyi Pékség', p: 'HU000120-GAS-0033', s: 'GA-99201', v: '12050 m3', n: 'GZ-2024/88', d: '2024.12.15' },
            { t: 'WATER', l: 'Kiszely László utca 7.', b: 'Virágbolt', p: 'HU-WTR-004830', s: 'W-002931', v: '430 m3', n: 'VZ-2024/05', d: '2024.12.01' },
            { t: 'ELECTRIC', l: 'Kossuth L. u. 3.', b: 'Ügyvédi Iroda', p: 'HU000120-11-S-5329', s: '33910211', v: '560 kWh', n: 'RF-2024/018', d: '2024.12.31' },
            { t: 'ELECTRIC', l: 'Korányi Sándor utca 5.', b: 'Sportegyesület', p: 'HU000120-11-S-4387', s: '12039122', v: '3200 kWh', n: 'RF-2024/019', d: '2024.12.28' }
        ];

        let currentType = 'ELECTRIC';

        function renderTable() {
            const body = document.getElementById('tenant-body');
            const search = document.getElementById('tenant-search').value.toLowerCase();
            const filtered = tenantData.filter(d => d.t === currentType && (d.l.toLowerCase().includes(search) || d.p.toLowerCase().includes(search)));

            body.innerHTML = filtered.map(row => `
                <tr>
                    <td style="font-weight:700;">${row.l}</td>
                    <td style="font-weight:600; color:var(--accent);">${row.b}</td>
                    <td><span class="pod-pill">${row.p}</span></td>
                    <td>${row.s}</td>
                    <td style="font-weight:800;">${row.v}</td>
                    <td style="color:var(--text-muted); font-size:0.7rem;">${row.n}</td>
                    <td><span class="status-badge status-ok">${row.d}</span></td>
                </tr>
            `).join('');
            if (filtered.length === 0) body.innerHTML = '<tr><td colspan="7" style="text-align:center; padding:2rem; color:var(--text-muted);">Nincs találat.</td></tr>';
        }

        function switchType(type, el) {
            currentType = type;
            document.querySelectorAll('.type-pill').forEach(p => p.classList.remove('active'));
            el.classList.add('active');
            renderTable();
        }

        function filterTable() { renderTable(); }

        function exportPDF() {
            const element = document.querySelector('.module-card');
            const opt = { margin: 10, filename: `Berloi_Elszamolasok.pdf`, image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2 }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' } };
            html2pdf().set(opt).from(element).save();
        }

        document.addEventListener('DOMContentLoaded', renderTable);
    </script>
</body>
</html>
